<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Shape -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg-grad)" />
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Modern POS Cash Register / Store Base -->
  <g filter="url(#glow)">
    <!-- Store Awning Roof -->
    <path d="M120 180 L392 180 L420 220 L92 220 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
    <path d="M120 180 L160 220" stroke="#38bdf8" stroke-width="3" />
    <path d="M210 180 L230 220" stroke="#38bdf8" stroke-width="3" />
    <path d="M302 180 L282 220" stroke="#38bdf8" stroke-width="3" />
    <path d="M392 180 L352 220" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Register Screen / Display Stand -->
    <rect x="156" y="235" width="200" height="135" rx="14" fill="#0f172a" stroke="url(#teal-grad)" stroke-width="5" />
    
    <!-- Screen Display Area -->
    <rect x="170" y="249" width="172" height="107" rx="8" fill="#020617" />
    
    <!-- Screen Content: Fast POS chart & numbers -->
    <rect x="185" y="265" width="65" height="12" rx="4" fill="url(#teal-grad)" />
    <rect x="185" y="285" width="100" height="8" rx="3" fill="#64748b" />
    <rect x="185" y="300" width="80" height="8" rx="3" fill="#475569" />
    <circle cx="310" cy="272" r="14" fill="url(#gold-grad)" />
    
    <!-- Cash Register Stand -->
    <path d="M236 370 L276 370 L290 405 L222 405 Z" fill="#334155" />
    <rect x="136" y="405" width="240" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <line x1="180" y1="416" x2="332" y2="416" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" />

    <!-- Receipt Tape Coming Out Top Right -->
    <path d="M320 120 L370 120 L370 230 L320 230 Z" fill="#f8fafc" rx="4" />
    <path d="M320 120 L328 126 L336 120 L345 126 L354 120 L362 126 L370 120" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <!-- Receipt printed lines -->
    <line x1="330" y1="140" x2="360" y2="140" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="330" y1="152" x2="355" y2="152" stroke="#64748b" stroke-width="2" />
    <line x1="330" y1="162" x2="358" y2="162" stroke="#64748b" stroke-width="2" />
    <line x1="330" y1="172" x2="348" y2="172" stroke="#64748b" stroke-width="2" />
    <line x1="330" y1="186" x2="360" y2="186" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <line x1="330" y1="198" x2="350" y2="198" stroke="#d97706" stroke-width="2" />

    <!-- Super Star Badge in Gold -->
    <g transform="translate(130, 110) scale(0.9)">
      <polygon points="40,5 50,28 75,30 56,47 62,72 40,58 18,72 24,47 5,30 30,28" fill="url(#gold-grad)" stroke="#b45309" stroke-width="2" />
    </g>
  </g>
</svg>
